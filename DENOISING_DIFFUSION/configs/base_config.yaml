project:
  name: exxa-denoising-diffusion
  seed: 42

data:
  train_noisy_path: data/dirty.npy
  train_clean_path: data/clean.npy
  image_size: 64
  patch_size: 64
  patches_per_image: 4
  val_split: 0.1
  test_split: 0.1
  num_workers: 2

model:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  channel_multipliers: [1, 2, 4, 8]
  dropout: 0.1

diffusion:
  timesteps: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

training:
  batch_size: 16
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.00001
  grad_clip_norm: 1.0
  use_amp: false
  device: auto

logging:
  log_every_n_steps: 100
  val_every_n_epochs: 1
  save_every_n_epochs: 5
  output_dir: experiments
  use_wandb: true
  wandb_project: exxa-denoising
